<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google-site-verification" content="YXOvsvRrMr6XDjT16WvCi4dbNEEzlSk5vUZEPs4tKYM" /><!-- Google Search Console -->
    <title>GCode Diff 3D</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="canvas"></canvas>

    <!-- 左側パネル -->
    <div id="panels">
      <!-- GCode A -->
      <div class="panel open" id="panel-a">
        <div class="panel-header" data-target="panel-a">
          <span class="panel-icon">▶</span>
          <span class="panel-title">GCode A</span>
          <span class="color-badge badge-a">A</span>
        </div>
        <div class="panel-body" id="panel-body-a">
          <textarea
            id="gcode-a"
            spellcheck="false"
            placeholder="Paste GCode A here or drag & drop a file…"
          ></textarea>
          <div class="panel-actions">
            <button class="btn btn-a" id="plot-a">▶ Plot A</button>
            <button class="btn btn-clear" id="clear-a">✕</button>
          </div>
        </div>
      </div>

      <!-- GCode B -->
      <div class="panel open" id="panel-b">
        <div class="panel-header" data-target="panel-b">
          <span class="panel-icon">▶</span>
          <span class="panel-title">GCode B</span>
          <span class="color-badge badge-b">B</span>
        </div>
        <div class="panel-body" id="panel-body-b">
          <textarea
            id="gcode-b"
            spellcheck="false"
            placeholder="Paste GCode B here or drag & drop a file…"
          ></textarea>
          <div class="panel-actions">
            <button class="btn btn-b" id="plot-b">▶ Plot B</button>
            <button class="btn btn-clear" id="clear-b">✕</button>
          </div>
        </div>
      </div>
    </div>

      <!-- Settings -->
      <div class="panel" id="panel-settings">
        <div class="panel-header" data-target="panel-settings">
          <span class="panel-icon">▶</span>
          <span class="panel-title">Settings</span>
          <span class="color-badge badge-settings">⚙</span>
        </div>
        <div class="panel-body" id="panel-body-settings">
          <div class="setting-row">
            <label class="setting-label" for="toggle-dark">Dark Mode</label>
            <label class="toggle-switch">
              <input type="checkbox" id="toggle-dark" checked>
              <span class="toggle-slider"></span>
            </label>
          </div>
          <div class="setting-divider"></div>
          <div class="setting-group-title">Visibility</div>
          <div class="setting-row">
            <label class="setting-label" for="toggle-a">Show A</label>
            <label class="toggle-switch">
              <input type="checkbox" id="toggle-a" checked>
              <span class="toggle-slider toggle-slider-a"></span>
            </label>
          </div>
          <div class="setting-row">
            <label class="setting-label" for="toggle-b">Show B</label>
            <label class="toggle-switch">
              <input type="checkbox" id="toggle-b" checked>
              <span class="toggle-slider toggle-slider-b"></span>
            </label>
          </div>
          <div class="setting-divider"></div>
          <div class="setting-group-title">Legend Colors</div>
          <div class="setting-row">
            <label class="setting-label" for="color-common">Common</label>
            <input type="color" class="color-input" id="color-common" value="#00e676">
          </div>
          <div class="setting-row">
            <label class="setting-label" for="color-only-a">Only A</label>
            <input type="color" class="color-input" id="color-only-a" value="#448aff">
          </div>
          <div class="setting-row">
            <label class="setting-label" for="color-only-b">Only B</label>
            <input type="color" class="color-input" id="color-only-b" value="#ff5252">
          </div>
          <div class="setting-row">
            <label class="setting-label" for="color-rapid">Rapid (G0)</label>
            <input type="color" class="color-input" id="color-rapid" value="#2a2a3a">
          </div>
        </div>
      </div>

    <div id="legend">
      <div class="legend-item">
        <span class="legend-dot" id="legend-common" style="background:#00e676"></span>Common
      </div>
      <div class="legend-item">
        <span class="legend-dot" id="legend-only-a" style="background:#448aff"></span>Only A
      </div>
      <div class="legend-item">
        <span class="legend-dot" id="legend-only-b" style="background:#ff5252"></span>Only B
      </div>
      <div class="legend-item" style="opacity:0.5">
        <span class="legend-dot" id="legend-rapid" style="background:#555"></span>Rapid
      </div>
    </div>

    <!-- ステータスバー -->
    <div id="statusbar">
      <span id="status-text">Paste GCode into A and/or B, then click Plot</span>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
